<style>
body{display:flex;flex-direction:column}
.center{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 16px 0}
.box{width:100%;max-width:400px}
.head{text-align:center;margin-bottom:22px}
.head .logo{width:64px;height:64px;border-radius:19px;margin:0 auto 14px;box-shadow:0 14px 40px -10px rgba(129,140,248,.9);animation:float 6s ease-in-out infinite}
.head .logo svg{width:36px;height:36px}
@keyframes float{50%{transform:translateY(-5px)}}
.head h1{margin:0;font-size:28px;font-weight:820;letter-spacing:-.03em}
.head h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.head .by{display:inline-block;margin-top:4px;font-size:13px;color:var(--mut)}
.head .by:hover{color:var(--c1);text-decoration:none}
form{padding:24px;position:relative;overflow:hidden}
form::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(400px 160px at 50% 0%,rgba(34,211,238,.1),transparent 70%)}
form h2{margin:0;font-size:17px;font-weight:720}
form p{margin:4px 0 4px;font-size:13px;color:var(--mut)}
.field{position:relative}
.field .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none}
.field input{padding-left:40px}
button[type=submit]{width:100%;margin-top:20px}
#err{display:none;margin-top:14px;padding:10px 12px;border-radius:12px;background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.35);color:#fecdd3;font-size:13px}
.secure{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;font-size:12px;color:var(--dim)}
.secure .ic{width:14px;height:14px}
.dev{display:flex;align-items:center;gap:12px;margin-top:14px;padding:14px 16px}
.dev .av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:820;color:#fff;background:var(--grad)}
.dev .t{flex:1;min-width:0}
.dev b{display:block;font-size:14px;line-height:1.3}
.dev span{font-size:12px;color:var(--mut)}
.dev a{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--txt);background:rgba(148,163,255,.08);box-shadow:inset 0 0 0 1px var(--line2)}
.dev a:hover{background:rgba(148,163,255,.16)}

<div class="center"><div class="box">
  <div class="head">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6l7 13 7-13"/></svg></div>
    <h1><span>V2Ray</span> for Huawei</h1>

  <form id="f" class="glass" autocomplete="on">
    <h2>Sign in</h2>

    <label for="u">Username</label>
    <div class="field"><svg class="ic"><use href="#i-user"/></svg><input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" value="admin" required></div>

<script>
// SHA-256 of a UTF-8 string -> hex. crypto.subtle only exists on https/localhost, so it's done by hand.
function sha256(str){
  var s=unescape(encodeURIComponent(str)),K=[],H=[],i,j,n=2,k=0,w=[],bits=s.length*8;
  function prime(x){for(var d=2;d*d<=x;d++)if(x%d===0)return false;return true}
  function frac(x){return (x-Math.floor(x))*4294967296|0}
  for(;k<64;n++)if(prime(n)){if(k<8)H[k]=frac(Math.pow(n,1/2));K[k++]=frac(Math.pow(n,1/3))}
  function rr(x,c){return (x>>>c)|(x<<(32-c))}
  s+='\x80';while(s.length%64!==56)s+='\x00';
  for(i=0;i<s.length;i++)w[i>>2]|=s.charCodeAt(i)<<((3-i%4)*8);
  w.push(Math.floor(bits/4294967296),bits|0);
  for(j=0;j<w.length;j+=16){
    var m=w.slice(j,j+16),a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(i=0;i<64;i++){
      if(i>=16){var x=m[i-15],y=m[i-2];m[i]=(m[i-16]+(rr(x,7)^rr(x,18)^(x>>>3))+m[i-7]+(rr(y,17)^rr(y,19)^(y>>>10)))|0}
      var t1=(h+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+m[i])|0;
      var t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&b)^(a&c)^(b&c)))|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  return H.map(function(v){return ('00000000'+(v>>>0).toString(16)).slice(-8)}).join('');
}
// same as the router's own login page (password_type 4)
function routerHash(u,p,t){return btoa(sha256(u+btoa(sha256(p))+t))}

var f=document.getElementById('f'),b=document.getElementById('b'),e=document.getElementById('err');
function json(r){return r.json()}
f.onsubmit=function(ev){
  ev.preventDefault();
  b.disabled=true;b.classList.add('busy');e.style.display='none';
  var u=f.u.value,p=f.p.value;
  fetch('cgi-bin/login.cgi?challenge',{cache:'no-store'}).then(json).then(function(c){
    if(!c.ok)throw new Error(c.msg||'Login failed');
    var body='c='+c.c+'&u='+encodeURIComponent(u)+'&h='+encodeURIComponent(routerHash(u,p,c.t));
    return fetch('cgi-bin/login.cgi',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body,cache:'no-store'}).then(json);
  }).then(function(j){
    if(j.ok){location.replace('/');return}
    throw new Error(j.msg||'Login failed');
  }).catch(function(x){
    e.textContent=x.message==='Failed to fetch'?'Cannot reach the router':x.message;e.style.display='block';
    f.p.value='';f.p.focus();b.disabled=false;b.classList.remove('busy');
  });
};
</script>
